name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: ${{ github.event_name != 'pull_request' || !github.event.pull_request.draft }}
    timeout-minutes: 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The shared runner names each phase: agent guard, lint, format, types, tests and build.
      # See scripts/worktree/validate.sh; it also requires a clean tree before and after.
      - name: Run full verification gate
        run: pnpm run worktree:validate

      # Reuse the Node 26 build. Do not rerun the development toolchain on the consumer floor.
      - name: Setup minimum supported Node
        uses: actions/setup-node@v6
        with:
          node-version: 24.0.0

      - name: Smoke-test built library and CLI on Node 24
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFileSync } from 'node:child_process';
          import { parseConfig } from './dist/index.js';
          const expected = { name: 'compat', retries: 3, verbose: false };
          assert.deepEqual(parseConfig('{"name":"compat"}'), { ok: true, value: expected });
          const output = execFileSync(process.execPath, ['dist/cli.js', '--config', '{"name":"compat"}'], { encoding: 'utf8' });
          assert.deepEqual(JSON.parse(output), { ok: true, command: 'parse-config', data: expected });
          JS
